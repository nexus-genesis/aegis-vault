name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version for a coordinated bump. Empty = auto minor bump (agent-keys stays ahead via 0.6.0, rest → 0.4.x). Use e.g. 0.4.0 to force.'
        type: string
        required: false
      dry_run:
        description: 'Print what bump would change without publishing (safe). Set false to actually publish.'
        type: boolean
        default: true
      environment:
        description: 'Target发布环境（环境门禁 reviewer/approval 依据此引用）。创建 Environment（testnet/staging/production）后可在 Settings 配置 required reviewers 实现手动收敛。'
        type: choice
        options:
          - staging
          - testnet
          - production
        default: staging
      profile_file:
        description: '发布前 preflight 校验的 deployment profile 文件路径（相对仓库根，如 mcp-server/examples/profile.production.env）。留空则按 CHAIN_PROFILE env 直读校验。'
        type: string
        required: false

jobs:
  # Sprint 7 T4 环境门禁：发布前必先过 preflight（profile fail-closed + artifact
  # 绑定 + store 可写性 + 版本 lockstep）与全量回归。任何 FAIL → publish 不启动。
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # SmartAccount artifact is NOT in git (out/ is gitignored). The
      # regression suite (smoke-e2e + mcp-server) hard-fails without it —
      # mirror ci.yml: install Foundry and compile before any test runs.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Forge build (solc 0.8.24)
        working-directory: contracts/solidity
        run: forge build --use 0.8.24

      - name: Verify deny-list single source (JS ↔ Solidity fixtures)
        run: npm run check:deny-list

      - name: Release preflight (Sprint 7 T4)
        env:
          NEXUS_PROFILE_FILE: ${{ inputs.profile_file || '' }}
        run: node scripts/release-preflight.mjs

      - name: Full regression (released packages)
        run: npm run test:release-packages
        timeout-minutes: 10

  publish:
    runs-on: ubuntu-latest
    needs: preflight
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      issues: write
    env:
      # Tag pushes always publish. workflow_dispatch publishes ONLY when
      # dry_run is explicitly false — dry-run is a preview-only mode, a
      # missing guard here would make a preview run hit the registry
      # (403 cannot-publish-over on every already-published version).
      PUBLISH_ENABLED: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}

    steps:
      - uses: actions/checkout@v4

      # NOTE: registry-url deliberately omitted here. With Trusted
      # Publishing (OIDC) the publish step authenticates via the job's
      # signed identity — a leftover .npmrc authToken placeholder from
      # setup-node would resolve to an empty token and shadow the OIDC
      # flow. The default registry (registry.npmjs.org) needs no config.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same artifact prerequisite as the preflight job: regression tests
      # need the compiled SmartAccount, which is not in git.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Forge build (solc 0.8.24)
        working-directory: contracts/solidity
        run: forge build --use 0.8.24

      # Dispatch bump: align all 6 published package versions + cross-references
      # (agent-sdk's peer `aegis-chain-eth ^0.3.0` → ^0.4.0 etc.) so npm
      # users actually receive the on-chain Smart Account capabilities described
      # in CHANGELOG/README (external review 2026-08-24 P0 "发布断层"). Never
      # downgrades (agent-keys 0.5.0 → 0.6.0 guard). Tag-triggered runs skip this.
      - name: Coordinated version bump (dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/release-bump.mjs ${{ inputs.dry_run != 'true' && format('--apply') || '' }} ${{ inputs.version && format('--to {0}', inputs.version) || '' }}

      - name: Dry-run — show planned versions, do not publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
        run: |
          echo "::warning::Dry-run requested — version bump previewed above, nothing published."
          exit 0

      - name: Run released package tests
        run: npm run test:release-packages
        timeout-minutes: 10

      # Trusted publishing (OIDC): four v0.7.0 runs failed with 403
      # "Two-factor authentication or granular access token with bypass 2fa
      # enabled is required to publish packages" (runs 34240906601 /
      # 34242536018 / 34287865194 / 34356555102, diagnostics issues #2 #3)
      # — the granular form never offers a bypass grant on this account
      # state, so no token can clear the registry's 2FA policy. npm's own
      # recommendation (the warning shown on the token form) is Trusted
      # Publishing: each publish authenticates via the job's signed OIDC
      # identity (id-token: write above). No token, no 2FA, no rotation.
      # Requires npm >= 11.5 plus one Trusted Publisher entry per package
      # on npmjs.com: repository nexus-genesis/aegis-vault, workflow
      # npm-publish.yml, environment production (must match the
      # environment key on this job).
      - name: Upgrade npm for trusted publishing (OIDC needs npm >= 11.5)
        run: npm install -g npm@11

      # Publish in dependency order, npm output captured to the job summary
      # on failure — step logs are truncated for anonymous visitors
      # ("View the raw logs" requires login), which made the first publish
      # attempt (run 34240906601) undiagnosable. Job summaries render
      # publicly on the run page.
      - name: Publish 11 packages (dependency order, provenance)
        if: ${{ env.PUBLISH_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO_NAME: ${{ github.repository }}
        run: |
          echo "npm $(npm --version) / node $(node --version) / auth: trusted publishing (OIDC, no token)"
          npm whoami > /tmp/whoami.txt 2>&1 && WHOAMI_STATE="ok" || WHOAMI_STATE="none — expected under trusted publishing (per-publish OIDC, no user token)"
          echo "npm whoami ($WHOAMI_STATE)"
          for p in packages/agent-keys packages/agent-sdk packages/chain-eth \
                   packages/chain-sol packages/chain-adapters mcp-server \
                   packages/guardrail-x402 packages/guardrail-ap2 packages/registry-8004 \
                   packages/agent-keys-cli packages/agent-keys-mcp; do
            name=$(node -p "require('./' + process.argv[1] + '/package.json').name" "$p")
            if ( cd "$p" && npm publish --provenance --access public ) > /tmp/pub-out.txt 2>&1; then
              echo "- ✅ \`$name\`" >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/pub-out.txt
            else
              {
                echo "### npm publish failed: \`$name\` ($p)"
                echo '```'
                tail -n 60 /tmp/pub-out.txt
                echo '```'
                echo "_npm $(npm --version) / node $(node --version) / NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}_"
              } >> "$GITHUB_STEP_SUMMARY"
              cat /tmp/pub-out.txt
              # Public diagnostics channel: step logs and job summaries are
              # login-gated; issues on this public repo are readable
              # anonymously and via API. Both prior v0.7.0 runs (34240906601,
              # 34242536018) failed at the first package with no readable
              # npm error anywhere.
              {
                echo "npm publish failed for \`$name\` ($p) on tag \`${{ github.ref_name }}\`."
                echo
                echo "npm whoami ($WHOAMI_STATE):"
                echo '```'
                cat /tmp/whoami.txt
                echo '```'
                echo
                echo '```'
                tail -n 80 /tmp/pub-out.txt
                echo '```'
                echo
                echo "npm $(npm --version) / node $(node --version) / auth: trusted publishing (OIDC)"
                echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                echo
                echo "Fail-fast loop: no partial release was published to npm."
              } > /tmp/issue-body.md
              jq -n --arg title "npm publish failed: ${{ github.ref_name }} / $name" \
                    --rawfile body /tmp/issue-body.md \
                    '{title: $title, body: $body}' > /tmp/issue.json
              code=$(curl -sS -o /tmp/issue-resp.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                --data-binary @/tmp/issue.json \
                "https://api.github.com/repos/$GH_REPO_NAME/issues")
              echo "diagnostics issue create: HTTP $code"
              [ "$code" = "201" ] || cat /tmp/issue-resp.json
              exit 1
            fi
          done

  # Post-publish verification: install the EXACTLY PUBLISHED versions (read
  # from the tag's checkout, i.e. the same package.json the publish job used)
  # from the npm registry into a fresh temp dir and run the full six-package
  # security smoke matrix (agent-sdk sign/verify, chain-eth Smart Account
  # INV-005/006/007, chain-sol sign/verify round-trip, chain-adapters address
  # derivation, agent-mcp load). Pinning the versions guarantees we verify
  # THIS tag's artifacts, not whatever happens to be `latest`.
  registry-smoke:
    runs-on: ubuntu-latest
    needs: publish
    # Skip when nothing was published (dispatch dry-run preview).
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run registry smoke against the published versions of this tag
        run: |
          VERSIONS=$(node -e '
            const fs = require("fs");
            const pkgs = [
              "packages/agent-keys",
              "packages/agent-sdk",
              "packages/chain-eth",
              "packages/chain-sol",
              "packages/chain-adapters",
              "mcp-server",
            ];
            const vs = pkgs.map(p => JSON.parse(fs.readFileSync(p + "/package.json", "utf8")).version);
            console.log(vs.join(" "));
          ')
          echo "Publishing smoke against versions: $VERSIONS"
          node scripts/release-smoke.mjs $VERSIONS
        timeout-minutes: 10
